services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_PASSWORD: sportsbook
            POSTGRES_DB: sportsbook
        volumes: ['data:/var/lib/postgresql/data']
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 2s
            retries: 20
    api:
        build: ./backend
        environment:
            DATABASE_URL: postgres://postgres:sportsbook@db/sportsbook?sslmode=disable
        depends_on:
            db:
                condition: service_healthy
    web:
        build: ./frontend
        ports: ['8080:80']
        depends_on: [api]
volumes:
    data:
